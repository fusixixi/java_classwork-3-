<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山大软院教务平台-登录</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"思源黑体",system-ui}
        :root{
            --sd-red:#A62424;
            --sd-dark:#283A53;
            --sd-blue:#4080FF;
            --sd-bg:#F8F5EB;
        }
        body{display:flex;min-height:100vh}
        .login-left{
            width:55%;background:var(--sd-dark);
            display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:40px;
        }
        .login-left h1{font-size:32px;color:var(--sd-red);background:#fff;padding:8px 16px;border-radius:6px;margin-bottom:20px}
        .login-left p{font-size:16px;opacity:0.9;line-height:1.8}
        .login-right{width:45%;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
        .login-card{width:80%;max-width:420px;padding:36px;border-radius:12px;box-shadow:0 2px 15px #ddd}
        .login-card h2{text-align:center;color:var(--sd-dark);margin-bottom:30px}
        .item{margin-bottom:18px}
        label{display:block;margin-bottom:6px;color:#555}
        input,select{
            width:100%;height:42px;border:1px solid #ccc;border-radius:6px;padding:0 12px;outline:none;
        }
        input:focus,select:focus{border-color:var(--sd-blue)}
        .login-btn{
            width:100%;height:44px;background:var(--sd-red);color:#fff;border:none;border-radius:6px;
            font-size:16px;cursor:pointer;transition:0.2s
        }
        .login-btn:hover{opacity:0.9}
        .tip{margin-top:14px;text-align:center;font-size:14px;color:#666}
        @media(max-width:768px){
            body{flex-direction:column}
            .login-left,.login-right{width:100%}
        }
    </style>
</head>
<body>
    <div class="login-left">
        <h1>山东大学软件学院</h1>
        <p>教务管理综合服务平台<br>管理员 / 教师 / 学生统一登录入口</p >
    </div>
    <div class="login-right">
        <div class="login-card">
            <h2>用户登录</h2>
            <div class="item">
                <label>登录身份</label>
                <select id="role">
                    <option value="student">学生</option>
                    <option value="teacher">教师</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <div class="item">
                <label>账号</label>
                <input type="text" id="acc" placeholder="请输入学号/工号" value="测试">
            </div>
            <div class="item">
                <label>密码</label>
                <input type="password" id="pwd" placeholder="请输入密码" value="123456">
            </div>
            <button class="login-btn" onclick="toIndex()">立即���录</button>
            <div class="tip">©山东大学软件学院教务研发中心</div>
        </div>
    </div>
    <script>
        function toIndex(){
            let role=document.getElementById('role').value;
            let name = document.getElementById('acc').value;
            location.href=`index_main.html?role=${role}&name=${name}`;
        }
    </script>
</body>
</html>
